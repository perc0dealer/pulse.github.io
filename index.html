<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PULSE — TERMINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06080A; --surf:#0D1117; --line:#1F262E;
    --text:#E8EDF2; --muted:#6E7A89; --long:#3ECF8E; --short:#FF5C6C;
    --accent:#7C9CFF; --gold:#E8B95C;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; height:100vh; overflow:hidden;}
  
  .device{ width:100%; height:100vh; display:flex; flex-direction:column; position:relative; }
  
  header{ padding:15px; background:rgba(6,8,10,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); z-index:100;}
  .head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .wordmark{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px; color:var(--accent); letter-spacing:1px;}
  
  .search-wrap input{ width:100%; background:var(--surf); border:1px solid var(--line); border-radius:10px; padding:10px; color:white; outline:none; font-size:13px; margin-bottom:10px;}

  main{flex:1; overflow-y:auto; padding:15px 15px 120px;}
  .screen{display:none;}
  .screen.active{display:block;}

  /* Рынок */
  .card{ background:var(--surf); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .card-top{display:flex; justify-content:space-between; margin-bottom:8px;}
  .pair{font-family:'Space Grotesk', sans-serif; font-weight:600;}
  .price{font-family:'JetBrains Mono'; font-size:16px; color:var(--accent);}
  
  /* Внутренний чат ИИ */
  #chat-container{ height:350px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:10px; padding-right:5px;}
  .m{ padding:10px 14px; border-radius:12px; font-size:13px; max-width:85%; line-height:1.4;}
  .m.ai{ background:var(--surf); border:1px solid var(--line); align-self:flex-start;}
  .m.user{ background:var(--accent); color:var(--bg); align-self:flex-end; font-weight:600;}

  /* Новости */
  .news-card{ background:var(--surf); padding:12px; border-radius:10px; margin-bottom:10px; border-left:3px solid var(--accent);}
  .news-card small{ color:var(--muted); font-size:10px; display:block; margin-bottom:4px;}
  .news-card p{ font-size:13px; font-weight:500;}

  /* Навигация */
  nav{ position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line); padding:10px 15px 25px; display:flex; gap:10px;}
  .nav-btn{ flex:1; padding:12px; text-align:center; background:var(--surf); border:1px solid var(--line); border-radius:12px; color:var(--muted); font-size:11px; cursor:pointer;}
  .nav-btn.active{ border-color:var(--accent); color:white; background:rgba(124,156,255,0.1);}

  .ai-input-box{ position:fixed; bottom:85px; left:15px; right:15px; background:var(--surf); border:1px solid var(--line); border-radius:15px; display:none; padding:5px 5px 5px 15px; align-items:center;}
  .ai-input-box input{ flex:1; background:none; border:none; color:white; outline:none; font-size:14px; }
  .ai-input-box button{ width:35px; height:35px; border-radius:12px; background:var(--accent); border:none; cursor:pointer;}
</style>
</head>
<body>
<div class="device">
  <header>
    <div class="head-row">
      <div class="wordmark">PULSE TERMINAL</div>
      <div id="connection" style="font-size:9px; color:var(--long); font-family:'JetBrains Mono'">● SYSTEM_LIVE</div>
    </div>
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Поиск монеты или акции..." oninput="filter()"></div>
  </header>

  <main>
    <!-- РЫНОК -->
    <section class="screen active" id="market">
      <div id="market-list">
        <!-- Генерируется JS -->
      </div>
    </section>

    <!-- НОВОСТИ -->
    <section class="screen" id="news">
      <div id="news-list">Загрузка ленты...</div>
    </section>

    <!-- AI ЧАТ ВНУТРИ -->
    <section class="screen" id="aichat">
      <div id="chat-container">
        <div class="m ai">Система готова. Задавай вопрос по рынку.</div>
      </div>
    </section>
  </main>

  <div class="ai-input-box" id="aiInputContainer">
    <input type="text" id="aiQuery" placeholder="Спроси ИИ...">
    <button onclick="askInternalAI()">→</button>
  </div>

  <nav>
    <div class="nav-btn active" onclick="tab('market', this)">МАРКЕТ</div>
    <div class="nav-btn" onclick="tab('news', this)">НОВОСТИ</div>
    <div class="nav-btn" onclick="tab('aichat', this)">AI ЧАТ</div>
    <div class="nav-btn" onclick="tg.sendData(JSON.stringify({action:'buy_pro'}))">PRO</div>
  </nav>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  const tg = window.Telegram.WebApp;
  tg.expand();

  // --- НАСТРОЙКИ ---
  const GEMINI_KEY = "AQ.Ab8RN6IDeLWZztMCIj2kbhFiMbDiYur2xbwxdjiMNrvcLPeWeg"; // ТВОЙ КЛЮЧ
  const FINNHUB_KEY = "AQ.Ab8RN6IDeLWZztMCIj2kbhFiMbDiYur2xbwxdjiMNrvcLPeWeg"; // ТВОЙ КЛЮЧ

  const symbols = [
    {s:'BTCUSDT', type:'crypto', n:'Bitcoin'},
    {s:'ETHUSDT', type:'crypto', n:'Ethereum'},
    {s:'SOLUSDT', type:'crypto', n:'Solana'},
    {s:'NVDA', type:'stock', n:'NVIDIA'},
    {s:'AAPL', type:'stock', n:'Apple'},
    {s:'TSLA', type:'stock', n:'Tesla'},
    {s:'AMZN', type:'stock', n:'Amazon'}
  ];

  // Загрузка цен
  async function loadPrices() {
    const list = document.getElementById('market-list');
    list.innerHTML = '';
    
    for(let item of symbols) {
      let price = "0.00";
      try {
        if(item.type === 'crypto') {
          const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${item.s}`);
          const d = await r.json();
          price = parseFloat(d.price).toLocaleString();
        } else {
          const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${item.s}&token=${FINNHUB_KEY}`);
          const d = await r.json();
          price = d.c.toLocaleString();
        }
      } catch(e) {}

      list.innerHTML += `
        <div class="card" data-n="${item.n} ${item.s}">
          <div class="card-top">
            <span class="pair">${item.n}</span>
            <span style="font-size:10px; color:var(--muted)">${item.s}</span>
          </div>
          <div class="price">$${price}</div>
        </div>
      `;
    }
  }

  // Загрузка новостей (Реальные через Finnhub)
  async function loadNews() {
    const container = document.getElementById('news-list');
    try {
      const r = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${FINNHUB_KEY}`);
      const data = await r.json();
      container.innerHTML = '';
      data.slice(0, 15).forEach(n => {
        container.innerHTML += `
          <div class="news-card">
            <small>${new Date(n.datetime * 1000).toLocaleTimeString()}</small>
            <p>${n.headline}</p>
          </div>
        `;
      });
    } catch(e) { container.innerText = "Ошибка загрузки новостей"; }
  }

  // ИИ ЧАТ ВНУТРИ ПРИЛОЖЕНИЯ (БЕЗ ВЫХОДА)
  async function askInternalAI() {
    const input = document.getElementById('aiQuery');
    const q = input.value.trim();
    if(!q) return;

    const container = document.getElementById('chat-container');
    container.innerHTML += `<div class="m user">${q}</div>`;
    input.value = '';
    container.scrollTop = container.scrollHeight;

    const aiMsg = document.createElement('div');
    aiMsg.className = 'm ai';
    aiMsg.innerText = 'Анализирую...';
    container.appendChild(aiMsg);

    try {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST',
        body: JSON.stringify({ contents: [{ parts: [{ text: q }] }] })
      });
      const d = await r.json();
      aiMsg.innerText = d.candidates[0].content.parts[0].text;
    } catch(e) {
      aiMsg.innerText = "Ошибка связи с ИИ.";
    }
    container.scrollTop = container.scrollHeight;
  }

  function tab(id, btn) {
    document.querySelectorAll('.screen, .nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
    document.getElementById('aiInputContainer').style.display = (id === 'aichat') ? 'flex' : 'none';
  }

  function filter() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = c.dataset.n.toLowerCase().includes(q) ? 'block' : 'none';
    });
  }

  // Обновление
  loadPrices();
  loadNews();
  setInterval(loadPrices, 10000); // Цены раз в 10 сек
  setInterval(loadNews, 120000);  // Новости раз в 2 мин
</script>
</body>
</html>
